{% extends "layout.html" %}
{% block title %}Communications{% endblock %}
{% block head %}
  {{ super() }}
  <link rel="stylesheet" href="/styles/toolpane.css" />
  <link rel="stylesheet" href="/styles/monitor.css" />
  <link rel = "stylesheet" href = "/styles/comms.css" />
  <link rel="stylesheet" href="/styles/formpane.css" />
{% endblock %}
{% block navheader %}Communications{% endblock %}
{% block content %} 
<main>
    <figure class="mowers">
        <figcaption id="mowers-fig-cap">Mowers</figcaption>
        <div class="fig-grid-body">
		    {% with toolpane = comms_control_toolpane %}
		        {% include "toolpane.html" %} 
		    {% endwith %}
			<table id="comms-grid" class="mower-grid">
			    <thead>
			        <tr>
			            {% for hdg in comms_hdr %}
			              {% if hdg|first in "_" %}
                             <th style="display: none">{{hdg}}</th>
                          {% else %}    
			                 <th class="hdg-cell">{{hdg}}</th>
			              {% endif %}   
			            {% endfor %}
                    </tr>
                </thead>
                <tbody>
                </tbody>
            </table>
        </div>
    </figure>
</main>
{% endblock %} 
{% block foot %} 
{{ super() }}
<script src="/scripts/http-fetcher.js"></script>
<script src="/scripts/grid.js"></script>
<script>
const autoFreezeMs = {{auto_freeze_ms}};
window.addEventListener('load', (event) => {

    //locate button constants
    const buttonConstants = window['commsctrl'].TOOLS;
    
    //last scan info pane
    const lastScanInfo = getButton('commsctrl', buttonConstants.LASTSCAN);
        
    //create data fetcher
    let df1 = new HttpFetcher("/comms_json", 10000, false, true); //leading
    
    //create grid
    let dt1 = new Grid('comms-grid');
    df1.addEventListener('headers-available', function(event) {
        const headers = event.detail;
        for (const pair of headers.entries()) {
            const key = pair[0];
            const value = pair[1];
            if (key == 'content-last-scan') {
                oldValue = lastScanInfo.value;
                if (value != oldValue) {
                    playAnimation();
                    lastScanInfo.value = value;
                }                      
            }
        }//next header
        
    }); 
    df1.addEventListener('body-available', function(event) {
        const json = event.detail;
        dt1.processBody(json);
    });
    
    //add specific actions to toolbar buttons
    const freezeBtn = getButton('commsctrl', buttonConstants.FREEZE);
    freezeBtn.addEventListener('click', function () {
        df1.isPaused = !df1.isPaused;
        if (df1.isPaused) {
            freezeBtn.classList.add('depressed');
        } else {
            freezeBtn.classList.remove('depressed');
            schedFreeze();
        }
    }, false);
    
    //initial
    df1.refresh();

    //add a scheduled event to freeze after delay - reduces server load
    schedFreeze();
    
    function schedFreeze() {
        setTimeout( function() { autoFreeze(); }, autoFreezeMs);
    }//end schedule freeze
    
    function autoFreeze() {
        if (!df1.isPaused) {
            freezeBtn.click();
        }//end not paused
	    else {
	       schedFreeze();
	    }//re-schedule
    }//end auto freeze
    
    const aniFrames = { textIndent: "-200px" };

	function playAnimation() {
	   lastScanInfo.animate(aniFrames, 1000);
	}
});
</script>
{% endblock %}
